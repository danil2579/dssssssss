<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cinematic Video Generator</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="title">
        <span class="dot"></span>
        Cinematic Video Generator
      </div>
      <div class="actions">
        <button id="save-btn" class="btn">Save config</button>
        <button id="render-btn" class="btn primary">Render</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>Assets</h2>

        <div class="field">
          <label>Main image (PNG with transparency recommended)</label>
          <div class="row">
            <input id="image-path" type="text" placeholder="/assets/main.png" />
            <label class="btn upload">
              Upload
              <input type="file" data-target="image-path" accept="image/*" hidden />
            </label>
          </div>
          <div id="image-preview" class="preview"></div>
        </div>

        <div class="field">
          <label>Audio</label>
          <div class="row">
            <input id="audio-path" type="text" placeholder="/assets/audio.mp3" />
            <label class="btn upload">
              Upload
              <input type="file" data-target="audio-path" accept="audio/*" hidden />
            </label>
          </div>
          <audio id="audio-preview" controls></audio>
        </div>

        <div class="field">
          <label>Creator handle</label>
          <input id="handle" type="text" placeholder="@mybrand" />
        </div>

        <div class="field grid-2">
          <div>
            <label>Duration (s)</label>
            <input id="duration" type="number" step="0.1" min="1" />
          </div>
          <div>
            <label>FPS</label>
            <input id="fps" type="number" step="1" min="1" />
          </div>
        </div>

        <div class="field">
          <label>Orientation</label>
          <div class="seg">
            <button data-orientation="landscape" class="seg-btn active">16:9 landscape</button>
            <button data-orientation="portrait" class="seg-btn">9:16 portrait</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>
          Captions
          <button id="add-caption" class="btn small">+ Add phrase</button>
        </h2>
        <div id="captions"></div>
      </section>

      <section class="panel output">
        <h2>Render output</h2>
        <pre id="logs" class="logs"></pre>
        <video id="player" controls playsinline></video>
        <div id="recent" class="recent"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
